# LLM benchmark configuration
# API key is NOT here — read from .env (HYPERQWEN_API_KEY)

model:
  provider: HyperQwen
  id: qwen3.8-27b
  endpoint: http://192.168.1.110:18020/v1/
  options:
    chat_template_kwargs:
      enable_thinking: false   # top-level enable_thinking is ignored by the server; true (or removed) benchmarks thinking (streamed as `reasoning` deltas)

benchmark:
  context_sizes: [1024, 4096, 8192, 16384, 32768]   # target prompt tokens
  concurrency_levels: [1, 2, 4, 8]
  requests_per_cell: 8            # measured requests per (context, concurrency) cell
  warmup_per_context: 1
  max_tokens: 256                 # fixed output length for all cells
  timeout_seconds: 300
  retries: 1

report:
  output_dir: results
  formats: [jsonl, csv, md]
